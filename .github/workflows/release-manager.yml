name: Release Drafter

on:
  push:
    # 1. Met à jour le brouillon de release UNIQUEMENT quand on merge sur main
    branches:
      - main
  
  # 2. Trigger pour l'autolabeler quand une PR est ouverte/modifiée
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write      # Pour créer/éditer la release
  pull-requests: write # Pour ajouter les labels sur les PRs

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          # 👇 C'est la ligne magique qui corrige l'erreur 422
          # Si l'événement est une PR, on désactive la création de release (on fait juste les labels)
          disable-releaser: ${{ github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}